{% extends "cleaning/base.html" %}{% block title %}Поиск{% endblock %}{% block content %}<section class="wrap page"><h1>Результаты поиска</h1><form class="filters" action="{% url 'search' %}"><input name="q" value="{{ q }}" placeholder="Что ищем?"><button class="btn">Найти</button></form><div class="cards">{% for s in results %}<article class="service-card"><h3>{{ s.name }}</h3><p>{{ s.description|truncatechars:120 }}</p><b>{{ s.price_per_m2 }} ₽/м²</b></article>{% empty %}<p>По вашему запросу ничего не найдено.</p>{% endfor %}</div></section>{% endblock %}
